<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>s4s</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <!-- JS 実行前・JS 失敗時でも OS 設定に沿った色になるよう 2 枚宣言しておく。
       手動でテーマを選んだ場合は JS が両方を実効色に書き換える。
       content は CSS の --theme-color（ライト＝--accent / ダーク＝--dark-surface）と同じ値を保つこと -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#5865f2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f2227">
  <script>
    // FOUC 対策: body 描画前に data-theme を確定させる。
    // ラベル更新など DOM 依存の処理は末尾の script 側（applyTheme）で行う。
    // キー名は末尾 script の THEME_KEY と一致させること（片方だけ変えると FOUC 対策だけが無効化される）。
    (function () {
      try {
        var t = localStorage.getItem("s4s-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) { /* localStorage 不可の環境では OS 追従にフォールバック */ }
    })();
  </script>
  <style>
    /*
     * テーマトークン。
     * 1) bare :root にダークパレットの実体（--dark-*）と、実効トークンのライト値を定義する。
     *    どの実効トークンもここに必ず定義があるので、下の 2 つのブロックは上書きに専念できる。
     * 2) OS がダーク かつ 手動ライト指定なし のとき、実効トークンを --dark-* に張り替える
     * 3) 手動ダーク指定のとき同じ張り替えをする。2 より後に書くことで OS 設定より優先される
     *    （どちらのセレクタも特異度は同じ (0,2,0) なので、順序で決まる）
     * 2 と 3 は張り替えの対応表が重複するが、色そのものは --dark-* の 1 箇所にしかないため、
     * 配色を変えるときに片方だけ古い値が残る事故は起きない。
     */
    :root {
      /* ダークパレット（実体）。配色を変えるときはここだけを触る */
      --dark-bg: #16181c;
      --dark-surface: #1f2227;
      --dark-text: #e3e5e8;
      --dark-text-secondary: #b0b6bc;
      --dark-text-muted: #9aa0a6;
      --dark-text-faint: #8d939a;
      --dark-border: #34373d;
      --dark-border-strong: #454a52;
      --dark-border-subtle: #2a2d33;
      --dark-accent: #8b95f7;
      --dark-accent-hover: #9ea7f9;
      --dark-accent-bg-hover: #262c40;
      --dark-on-accent: #16181c;
      --dark-zebra-odd: #232a38;
      --dark-danger: #ff6b6b;
      --dark-danger-bg-hover: #3b2326;
      --dark-btn-bg: #2b2f36;
      --dark-btn-bg-hover: #363b43;
      --dark-btn-fg: #d2d6da;
      --dark-shadow-card: 0 1px 4px rgba(0,0,0,.35);

      /* 実効トークン（既定＝ライト） */
      --scheme: light;
      --bg: #f5f5f5;
      --surface: #fff;
      --text: #222;
      --text-secondary: #666;
      --text-muted: #888;
      --text-faint: #999;
      --border: #e0e0e0;
      --border-strong: #ccc;
      --border-subtle: #f0f0f0;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --accent-bg-hover: #eef0fd;
      --on-accent: #fff;
      --zebra-odd: #e8f0fe;
      --danger: #c00;
      --danger-bg-hover: #fdd;
      --btn-bg: #f0f0f0;
      --btn-bg-hover: #e0e0e0;
      --btn-fg: #444;
      --shadow-card: 0 1px 4px rgba(0,0,0,.07);
      /* PWA のツールバー色。JS がこの実効値を <meta name="theme-color"> に反映する。
         ライトは従来の挙動（アクセント色）を踏襲し、ダークはヘッダ背景に合わせる */
      --theme-color: #5865f2;
      color-scheme: var(--scheme);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --scheme: dark;
        --bg: var(--dark-bg);
        --surface: var(--dark-surface);
        --text: var(--dark-text);
        --text-secondary: var(--dark-text-secondary);
        --text-muted: var(--dark-text-muted);
        --text-faint: var(--dark-text-faint);
        --border: var(--dark-border);
        --border-strong: var(--dark-border-strong);
        --border-subtle: var(--dark-border-subtle);
        --accent: var(--dark-accent);
        --accent-hover: var(--dark-accent-hover);
        --accent-bg-hover: var(--dark-accent-bg-hover);
        --on-accent: var(--dark-on-accent);
        --zebra-odd: var(--dark-zebra-odd);
        --danger: var(--dark-danger);
        --danger-bg-hover: var(--dark-danger-bg-hover);
        --btn-bg: var(--dark-btn-bg);
        --btn-bg-hover: var(--dark-btn-bg-hover);
        --btn-fg: var(--dark-btn-fg);
        --shadow-card: var(--dark-shadow-card);
        --theme-color: var(--dark-surface);
      }
    }

    :root[data-theme="dark"] {
      --scheme: dark;
      --bg: var(--dark-bg);
      --surface: var(--dark-surface);
      --text: var(--dark-text);
      --text-secondary: var(--dark-text-secondary);
      --text-muted: var(--dark-text-muted);
      --text-faint: var(--dark-text-faint);
      --border: var(--dark-border);
      --border-strong: var(--dark-border-strong);
      --border-subtle: var(--dark-border-subtle);
      --accent: var(--dark-accent);
      --accent-hover: var(--dark-accent-hover);
      --accent-bg-hover: var(--dark-accent-bg-hover);
      --on-accent: var(--dark-on-accent);
      --zebra-odd: var(--dark-zebra-odd);
      --danger: var(--dark-danger);
      --danger-bg-hover: var(--dark-danger-bg-hover);
      --btn-bg: var(--dark-btn-bg);
      --btn-bg-hover: var(--dark-btn-bg-hover);
      --btn-fg: var(--dark-btn-fg);
      --shadow-card: var(--dark-shadow-card);
      --theme-color: var(--dark-surface);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    header h1 {
      font-size: 1.2rem;
      padding: 1rem 0;
    }

    .tabs {
      display: flex;
      gap: 0;
    }

    .tab {
      padding: .9rem 1.2rem;
      cursor: pointer;
      font-size: .9rem;
      border-bottom: 2px solid transparent;
      color: var(--text-secondary);
    }

    .tab.active {
      border-bottom-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* ヘッダ右端のアイコンボタン群（テーマ切替・通知） */
    .header-actions {
      margin-left: auto;
      display: flex;
      gap: .5rem;
    }

    /* ビューポート: 横スライドを隠し、高さを固定して縦スクロールはページ側に任せる */
    main {
      overflow-x: hidden;
      height: calc(100vh - var(--header-h, 56px));
      /* モバイルのアドレスバー伸縮に追従する dvh を優先（非対応環境は上の vh にフォールバック） */
      height: calc(100dvh - var(--header-h, 56px));
    }

    /* 3ページを横並びにするトラック。translateX で表示ページを切り替える */
    .page-track {
      display: flex;
      height: 100%;
      transition: transform .25s ease;
    }

    .page {
      width: 100%;
      flex-shrink: 0;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 各ページ内のコンテンツ幅・余白（旧 main の役割） */
    .page-inner {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    /* エントリ一覧 */
    .entry-list { display: flex; flex-direction: column; gap: .75rem; }

    .entry-card {
      background: var(--surface);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: var(--shadow-card);
    }

    .entry-meta {
      font-size: .75rem;
      color: var(--text-muted);
      margin-bottom: .35rem;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }

    .entry-meta-top {
      display: flex;
      gap: .75rem;
    }

    .entry-meta-actions {
      display: flex;
      gap: .5rem;
    }

    .entry-title {
      font-size: 1rem;
      line-height: 1.4;
    }

    .entry-title a {
      color: var(--text);
      text-decoration: none;
    }

    .entry-title a:hover {
      text-decoration: underline;
    }

    .zebra-even { background: var(--surface); }
    .zebra-odd  { background: var(--zebra-odd); }

    .empty { color: var(--text-faint); font-size: .9rem; text-align: center; padding: 2rem; }

    /* フィード管理 */
    .card {
      background: var(--surface);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-card);
    }

    .add-form { display: flex; gap: .5rem; }

    .search-box { margin-bottom: .75rem; }

    .search-box input {
      width: 100%;
      padding: .5rem .75rem;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--surface);
      color: var(--text);
    }

    .add-form input {
      flex: 1;
      min-width: 0;
      padding: .5rem .75rem;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--surface);
      color: var(--text);
    }

    /* 既定のプレースホルダ色はテーマに追従しないため明示する（opacity:1 は Firefox 対策） */
    input::placeholder { color: var(--text-secondary); opacity: 1; }

    button {
      padding: .5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .9rem;
      white-space: nowrap;
    }

    .btn-add { background: var(--accent); color: var(--on-accent); }
    .btn-add:hover { background: var(--accent-hover); }
    .btn-delete { background: var(--btn-bg); color: var(--danger); }
    .btn-delete:hover { background: var(--danger-bg-hover); }
    .btn-rename { background: var(--btn-bg); color: var(--btn-fg); }
    .btn-rename:hover { background: var(--btn-bg-hover); }
    .btn-read { background: none; border: 1px solid var(--border-strong); color: var(--text-muted); font-size: .75rem; padding: .2rem .6rem; border-radius: 4px; }
    .btn-read:hover { background: var(--btn-bg); }
    .btn-save { background: none; border: 1px solid var(--accent); color: var(--accent); font-size: .75rem; padding: .2rem .6rem; border-radius: 4px; }
    .btn-save:hover { background: var(--accent-bg-hover); }
    .btn-theme { background: var(--btn-bg); color: var(--btn-fg); }
    .btn-theme:hover { background: var(--btn-bg-hover); }
    .btn-notify { background: var(--btn-bg); color: var(--btn-fg); }
    .btn-notify:hover { background: var(--btn-bg-hover); }
    .btn-notify.active { background: var(--accent); color: var(--on-accent); }
    .btn-notify.active:hover { background: var(--accent-hover); }

    .source-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .6rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .source-item:last-child { border-bottom: none; }

    .source-actions { display: flex; gap: .5rem; flex-shrink: 0; }

    .source-info { min-width: 0; }
    .source-domain { font-weight: 600; font-size: .9rem; }
    .source-url {
      font-size: .75rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .error { color: var(--danger); font-size: .85rem; margin-top: .5rem; }

    @media (max-width: 480px) {
      header { gap: .75rem; padding: 0 .75rem; }
      header h1 { font-size: 1rem; }
      .tab { padding: .9rem .5rem; font-size: .85rem; }
      .entry-title { font-size: .95rem; }
      /* アイコンボタンが 2 つ並ぶぶん横幅が厳しいので、狭い画面では全体を詰める。
         収まらない場合はタブ側から先に縮むよう .tabs の min-width も解除しておく */
      .tabs { min-width: 0; }
      .header-actions { gap: .35rem; }
      .header-actions button { padding: .5rem .45rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1 onclick="refresh()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();refresh();}" role="button" tabindex="0" aria-label="一覧を最新化" style="cursor:pointer" title="クリックで最新化">s4s</h1>
    <nav class="tabs">
      <div class="tab active" onclick="switchTab('entries')">新着</div>
      <div class="tab" onclick="switchTab('saved')">キュー</div>
      <div class="tab" onclick="switchTab('sources')">フィード</div>
    </nav>
    <div class="header-actions">
      <button id="themeBtn" class="btn-theme" onclick="toggleTheme()" title="テーマ: 自動（OS追従）" aria-label="テーマ: 自動（OS追従）（クリックで切り替え）">🌓</button>
      <button id="notifyBtn" class="btn-notify" onclick="toggleNotification()">🔕</button>
    </div>
  </header>

  <main>
    <div class="page-track" id="pageTrack">
      <!-- 新着一覧 -->
      <div id="page-entries" class="page active">
        <div class="page-inner">
          <div id="entryList" class="entry-list"></div>
        </div>
      </div>

      <!-- 後で読む -->
      <div id="page-saved" class="page">
        <div class="page-inner">
          <div class="card">
            <div class="add-form">
              <input id="savedUrlInput" type="url" placeholder="https://example.com" />
              <button class="btn-add" onclick="addSaved()">追加</button>
            </div>
            <div id="savedAddError" class="error"></div>
          </div>
          <div class="search-box">
            <input id="savedSearchInput" type="search" placeholder="タイトルで絞り込み" oninput="renderSaved()" />
          </div>
          <div id="savedList" class="entry-list"></div>
        </div>
      </div>

      <!-- フィード管理 -->
      <div id="page-sources" class="page">
        <div class="page-inner">
          <div class="card">
            <div class="add-form">
              <input id="urlInput" type="url" placeholder="https://example.com" />
              <button class="btn-add" onclick="addSource()">追加</button>
            </div>
            <div id="addError" class="error"></div>
          </div>
          <div class="card">
            <div id="sourceList"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const TOKEN = new URLSearchParams(location.search).get("token") ?? "";
    const BASE = location.pathname.replace(/\/$/, "");
    document.querySelector('link[rel="manifest"]').href = `manifest.json?token=${encodeURIComponent(TOKEN)}&base=${encodeURIComponent(BASE)}`;
    const api = (path) => `${BASE}${path}?token=${encodeURIComponent(TOKEN)}`;
    let swRegistration = null;
    let vapidPublicKey = null;
    let savedEntries = [];

    // タブの並び順（横位置）。スワイプ切替・active 判定・hash 検証で共用する
    const TABS = ["entries", "saved", "sources"];

    function switchTab(name) {
      document.querySelectorAll(".tab").forEach((t, i) => {
        t.classList.toggle("active", TABS[i] === name);
      });
      document.querySelectorAll(".page").forEach(p => {
        const isActive = p.id === `page-${name}`;
        p.classList.toggle("active", isActive);
        // 非表示ページは Tab フォーカス・読み上げの対象外にする
        p.inert = !isActive;
      });
      // トラックを横スライドして対象ページを表示する
      const index = TABS.indexOf(name);
      if (index >= 0) {
        document.getElementById("pageTrack").style.transform = `translateX(-${index * 100}%)`;
      }
      location.hash = name;
      if (name === "entries") loadEntries();
      if (name === "saved") loadSaved();
      if (name === "sources") loadSources();
    }

    function refresh() {
      const active = document.querySelector(".page.active");
      if (active) switchTab(active.id.replace("page-", ""));
    }

    // ヘッダの実高さを CSS 変数に反映（main の高さ算出に使う）
    function syncHeaderHeight() {
      const h = document.querySelector("header").offsetHeight;
      document.documentElement.style.setProperty("--header-h", `${h}px`);
    }
    syncHeaderHeight();
    window.addEventListener("resize", syncHeaderHeight);

    const initialTab = location.hash.replace("#", "") || "entries";
    switchTab(TABS.includes(initialTab) ? initialTab : "entries");
    initNotification();

    // --- テーマ切り替え（auto → light → dark → auto） ---
    // data-theme 自体は <head> のインラインスクリプトで確定済みなので、ここはボタン表示と
    // theme-color の反映だけを担当する。付随機能が本体を巻き込まないよう、タブ描画と
    // 通知初期化より後ろに置いている。
    const THEME_KEY = "s4s-theme"; // <head> のインラインスクリプトと同じキーにすること
    const THEMES = ["auto", "light", "dark"];
    const THEME_ICON = { auto: "🌓", light: "☀️", dark: "🌙" };
    const THEME_LABEL = { auto: "自動（OS追従）", light: "ライト", dark: "ダーク" };
    const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
    // 宣言時の theme-color。auto ではこの値に戻し、media 属性による OS 追従を活かす
    const themeMetas = [...document.querySelectorAll('meta[name="theme-color"]')]
      .map(el => ({ el, declared: el.content }));

    function storedTheme() {
      try {
        const t = localStorage.getItem(THEME_KEY);
        return THEMES.includes(t) ? t : "auto";
      } catch (e) {
        return "auto";
      }
    }

    // localStorage が使えない環境でも循環できるよう、現在値はメモリでも保持する
    let currentTheme = storedTheme();

    function applyTheme(theme) {
      currentTheme = theme;
      if (theme === "auto") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = theme;

      // data-theme 反映後なので --theme-color は実効値に解決される。
      // 手動指定時は OS 設定と食い違うため、どちらの media が当たっても同じ色になるよう両方に入れる
      const color = getComputedStyle(document.documentElement).getPropertyValue("--theme-color").trim();
      themeMetas.forEach(({ el, declared }) => {
        el.content = theme === "auto" ? declared : (color || declared);
      });

      const btn = document.getElementById("themeBtn");
      btn.textContent = THEME_ICON[theme];
      btn.title = `テーマ: ${THEME_LABEL[theme]}`;
      btn.setAttribute("aria-label", `テーマ: ${THEME_LABEL[theme]}（クリックで切り替え）`);
    }

    function toggleTheme() {
      const next = THEMES[(THEMES.indexOf(currentTheme) + 1) % THEMES.length];
      try {
        localStorage.setItem(THEME_KEY, next);
      } catch (e) { /* 保存できなくても表示の切り替えは行う */ }
      applyTheme(next);
    }

    applyTheme(currentTheme);
    try {
      // auto のときだけ OS 設定の変更に追従する
      // （MediaQueryList.addEventListener 非対応の古い Safari では OS 追従のみ効かない）
      darkQuery.addEventListener("change", () => {
        if (currentTheme === "auto") applyTheme("auto");
      });
    } catch (e) { /* 追従できなくても手動切り替えは動く */ }

    // スマホでの横スワイプによるタブ切替（縦スクロールは阻害しない）
    (function setupSwipe() {
      const SWIPE_THRESHOLD = 50; // 横移動量がこれを超えたら切替
      let startX = 0, startY = 0, tracking = false;
      const main = document.querySelector("main");

      main.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) { tracking = false; return; }
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        tracking = true;
      }, { passive: true });

      main.addEventListener("touchend", (e) => {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0];
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        // 横移動が縦移動より大きく、かつ閾値超のときのみ発火
        if (Math.abs(dx) <= Math.abs(dy) || Math.abs(dx) < SWIPE_THRESHOLD) return;
        const active = document.querySelector(".page.active");
        if (!active) return;
        const current = TABS.indexOf(active.id.replace("page-", ""));
        if (current < 0) return;
        const next = dx < 0 ? current + 1 : current - 1; // 左スワイプで右隣、右スワイプで左隣
        if (next < 0 || next >= TABS.length) return; // 端ではループしない
        switchTab(TABS[next]);
      }, { passive: true });

      main.addEventListener("touchcancel", () => { tracking = false; }, { passive: true });
    })();

    async function loadEntries() {
      const res = await fetch(api("/api/entries"));
      const entries = await res.json();
      const el = document.getElementById("entryList");

      if (entries.length === 0) {
        el.innerHTML = '<div class="empty">新着エントリはありません</div>';
        return;
      }

      const groups = [];
      const groupIndex = {};
      for (const e of entries) {
        const key = e.source_name ?? e.domain;
        if (!(key in groupIndex)) {
          groupIndex[key] = groups.length;
          groups.push({ key, entries: [] });
        }
        groups[groupIndex[key]].entries.push(e);
      }

      el.innerHTML = groups.flatMap((g, i) => {
        const zebra = i % 2 === 0 ? "zebra-even" : "zebra-odd";
        return g.entries.map(e => `
        <div class="entry-card ${zebra}" id="entry-${e.id}" data-group="${g.key}">
          <div class="entry-meta">
            <div class="entry-meta-top">
              <span>${g.key}</span>
              <span>${e.created_at}</span>
            </div>
            <div class="entry-meta-actions">
              <button class="btn-save" onclick="saveEntry('${e.id}')">後で読む</button>
              <button class="btn-read" onclick="markRead('${e.id}')">既読</button>
            </div>
          </div>
          <div class="entry-title"><a href="${e.link}" target="_blank" rel="noopener">${e.title ?? "(タイトルなし)"}</a></div>
        </div>`);
      }).join("");
    }

    let sourcesCache = [];

    async function loadSources() {
      const res = await fetch(api("/api/sources"));
      const sources = await res.json();
      sourcesCache = sources;
      const el = document.getElementById("sourceList");

      if (sources.length === 0) {
        el.innerHTML = '<div class="empty">登録されているフィードはありません</div>';
        return;
      }

      el.innerHTML = sources.map(s => `
        <div class="source-item">
          <div class="source-info">
            <div class="source-domain">${s.name ?? s.domain}</div>
            <div class="source-url">${s.url}</div>
          </div>
          <div class="source-actions">
            <button class="btn-rename" onclick="renameSource('${s.url}')">名前変更</button>
            <button class="btn-delete" onclick="deleteSource('${s.url}')">削除</button>
          </div>
        </div>
      `).join("");
    }

    async function renameSource(url) {
      const current = sourcesCache.find(s => s.url === url);
      const cur = current ? (current.name ?? current.domain) : "";
      const input = prompt("新しいフィード名", cur);
      if (input === null) return;
      const name = input.trim();
      if (!name) return;
      const res = await fetch(api("/api/sources"), {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, name })
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.detail ?? "エラーが発生しました");
        return;
      }
      await Promise.all([loadSources(), loadEntries()]);
    }

    async function addSource() {
      const input = document.getElementById("urlInput");
      const errEl = document.getElementById("addError");
      errEl.textContent = "";

      const url = input.value.trim();
      if (!url) return;
      const res = await fetch(api("/api/sources"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });

      if (!res.ok) {
        const data = await res.json();
        errEl.textContent = data.detail ?? "エラーが発生しました";
        return;
      }

      input.value = "";
      await Promise.all([loadSources(), loadEntries()]);
    }

    async function deleteSource(url) {
      if (!confirm(`削除しますか？\n${url}`)) return;
      await fetch(api("/api/sources"), {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });
      await Promise.all([loadSources(), loadEntries()]);
    }

    document.getElementById("urlInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addSource();
    });

    function reapplyZebra() {
      const list = document.getElementById("entryList");
      const groups = [...new Set([...list.querySelectorAll(".entry-card")].map(el => el.dataset.group))];
      list.querySelectorAll(".entry-card").forEach(el => {
        const idx = groups.indexOf(el.dataset.group);
        el.classList.toggle("zebra-even", idx % 2 === 0);
        el.classList.toggle("zebra-odd",  idx % 2 !== 0);
      });
    }

    async function markRead(id) {
      await fetch(api(`/api/entries/${id}`), { method: "DELETE" });
      document.getElementById(`entry-${id}`).remove();
      reapplyZebra();
    }

    async function saveEntry(id) {
      await fetch(api(`/api/entries/${id}/save`), { method: "POST" });
      document.getElementById(`entry-${id}`).remove();
      reapplyZebra();
    }

    async function loadSaved() {
      const res = await fetch(api("/api/saved"));
      savedEntries = await res.json();
      renderSaved();
    }

    function renderSaved() {
      const el = document.getElementById("savedList");

      if (savedEntries.length === 0) {
        el.innerHTML = '<div class="empty">後で読む記事はありません</div>';
        return;
      }

      const q = document.getElementById("savedSearchInput").value.trim().toLowerCase();
      const entries = q
        ? savedEntries.filter(e => (e.title ?? "").toLowerCase().includes(q))
        : savedEntries;

      if (entries.length === 0) {
        el.innerHTML = '<div class="empty">該当する記事はありません</div>';
        return;
      }

      el.innerHTML = entries.map(e => {
        const key = e.source_name ?? e.domain;
        return `
        <div class="entry-card zebra-even" id="saved-${e.id}">
          <div class="entry-meta">
            <div class="entry-meta-top">
              <span>${key}</span>
              <span>${e.created_at}</span>
            </div>
            <div class="entry-meta-actions">
              <button class="btn-read" onclick="deleteSaved('${e.id}')">削除</button>
            </div>
          </div>
          <div class="entry-title"><a href="${e.link}" target="_blank" rel="noopener">${e.title ?? "(タイトルなし)"}</a></div>
        </div>`;
      }).join("");
    }

    async function addSaved() {
      const input = document.getElementById("savedUrlInput");
      const errEl = document.getElementById("savedAddError");
      errEl.textContent = "";

      const url = input.value.trim();
      if (!url) return;
      const res = await fetch(api("/api/saved"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url })
      });

      if (!res.ok) {
        const data = await res.json();
        errEl.textContent = data.detail ?? "エラーが発生しました";
        return;
      }

      input.value = "";
      await loadSaved();
    }

    document.getElementById("savedUrlInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addSaved();
    });

    async function deleteSaved(id) {
      await fetch(api(`/api/saved/${id}`), { method: "DELETE" });
      savedEntries = savedEntries.filter(e => String(e.id) !== String(id));
      renderSaved();
    }

    // --- push通知 ---

    async function initNotification() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
      try {
        swRegistration = await navigator.serviceWorker.register("sw.js");
      } catch (e) {
        return;
      }
      const res = await fetch(api("/api/vapid-public-key"));
      if (res.ok) {
        const data = await res.json();
        vapidPublicKey = data.publicKey;
      }
      // SWにページURL（トークン付き）を送信
      const sendUrl = () => {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: "SET_URL", url: location.href });
        }
      };
      sendUrl();
      navigator.serviceWorker.addEventListener("controllerchange", sendUrl);
      updateNotifyBtn();
    }

    async function updateNotifyBtn() {
      if (!swRegistration) return;
      const sub = await swRegistration.pushManager.getSubscription();
      const btn = document.getElementById("notifyBtn");
      btn.classList.toggle("active", !!sub);
      btn.textContent = sub ? "🔔" : "🔕";
    }

    async function toggleNotification() {
      if (!swRegistration) return;
      const existing = await swRegistration.pushManager.getSubscription();
      if (existing) {
        await fetch(api("/api/push/subscribe"), {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ endpoint: existing.endpoint, p256dh: btoa(String.fromCharCode(...new Uint8Array(existing.getKey("p256dh")))), auth: btoa(String.fromCharCode(...new Uint8Array(existing.getKey("auth")))) }),
        });
        await existing.unsubscribe();
      } else {
        if (!vapidPublicKey) { alert("VAPID keys が設定されていません"); return; }
        const perm = await Notification.requestPermission();
        if (perm !== "granted") return;
        const sub = await swRegistration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
        });
        await fetch(api("/api/push/subscribe"), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            endpoint: sub.endpoint,
            p256dh: btoa(String.fromCharCode(...new Uint8Array(sub.getKey("p256dh")))),
            auth: btoa(String.fromCharCode(...new Uint8Array(sub.getKey("auth")))),
          }),
        });
      }
      updateNotifyBtn();
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }
  </script>
</body>
